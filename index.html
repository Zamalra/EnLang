<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8faf6">
<title>EnLang · 영어 학습</title>
<link rel="stylesheet" href="./style.css">
<script defer src="./learning.js"></script>
<script defer src="./layout.js"></script>
<script defer src="./app.js"></script>
</head>
<body>
<div class="app">
  <header class="top"><img src="./assets/EnLang-logo-horizontal.svg" alt="EnLang" width="112" height="34" style="display: block; max-width: 100%; height: auto;"><output id="xp" class="xp" aria-label="경험치"></output><button id="settings" class="settings" aria-label="설정">⚙</button></header>
  <main id="main">
    <section id="learn" aria-label="학습">
      <header class="banner"><span id="unit"></span><h1 id="title"></h1><p id="description"></p></header>
      <section class="progress"><div><strong>학습 진행도</strong><span id="count"></span></div><progress id="progress" aria-label="학습 진행도"></progress></section>
      <ol id="path" class="path" aria-label="레슨 경로"></ol>
      <aside class="next"><span class="lock" aria-hidden="true"></span><div><span>다음 유닛</span><strong id="next"></strong><small id="next-status"></small></div></aside>
    </section>
    <section id="review" hidden><h1>복습</h1><div id="review-list"></div></section>
    <section id="history" hidden><h1>학습 기록</h1><div id="history-list"></div></section>
    <p id="error" role="alert" hidden></p>
  </main>
  <nav aria-label="하단 내비게이션">
    <button data-page="learn" aria-current="page"><span aria-hidden="true" class="nav-icon map"></span>학습</button>
    <button data-page="review"><span aria-hidden="true" class="nav-icon book"></span>복습</button>
    <button data-page="history"><span aria-hidden="true" class="nav-icon chart"></span>기록</button>
  </nav>
</div>
<dialog id="dialog" aria-labelledby="dialog-title"><form method="dialog" class="close"><button aria-label="닫기">×</button></form><h2 id="dialog-title"></h2><div id="dialog-body"></div></dialog>
</body>
</html>
