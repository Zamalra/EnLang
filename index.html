<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8faf6">
<title>EnLang · 제주어 학습</title>
<link rel="stylesheet" href="./style.css">
<script defer src="./learning.js"></script>
<script defer src="./layout.js"></script>
<script defer src="./app.js"></script>
</head>
<body>
<div class="app">
  <header class="top"><img src="./assets/EnLang-logo-horizontal.svg" alt="EnLang" width="112" height="34" style="display: block; max-width: 100%; height: auto;"><output id="xp" class="xp" aria-label="경험치"></output><button id="settings" class="settings" aria-label="설정">⚙</button></header>
  <main id="main">
    <section id="learn" aria-label="학습">
      <header class="banner"><span id="unit"></span><h1 id="title"></h1><p id="description"></p></header>
      <section class="progress"><div><strong>학습 진행도</strong><span id="count"></span></div><progress id="progress" aria-label="학습 진행도"></progress></section>
      <ol id="path" class="path" aria-label="레슨 경로"></ol>
      <aside class="next"><span class="lock" aria-hidden="true"></span><div><span>다음 유닛</span><strong id="next"></strong><small id="next-status"></small></div></aside>
    </section>
    <section id="review" aria-labelledby="adventure-title" hidden>
      <h1 id="adventure-title">제주 모험</h1>
      <p class="adventure-intro">레슨을 완료할 때마다 새로운 지역이 열려요.</p>
      <p id="adventure-progress" role="status"></p>
      <div id="adventure-map" class="adventure-map" role="group" aria-label="제주 지역 지도">
        <img src="./assets/jeju-map.png" alt="" width="840" height="600">
      </div>
      <p class="map-credit">해안선 자료 · <a href="https://www.naturalearthdata.com/">Natural Earth</a></p>
      <div class="adventure-detail" aria-live="polite">
        <h2 id="region-title"></h2>
        <p id="region-description"></p>
        <button id="region-learn" class="action" type="button" hidden>학습으로 가기</button>
      </div>
      <h2 class="adventure-review">레슨 복습</h2>
      <div id="review-list"></div>
    </section>
    <section id="history" hidden><h1>학습 기록</h1><div id="history-list"></div></section>
    <p id="error" role="alert" hidden></p>
  </main>
  <nav aria-label="하단 내비게이션">
    <button data-page="learn" aria-current="page"><img src="./assets/learn.svg" alt="" width="24" height="24">학습</button>
    <button data-page="review"><img src="./assets/home.svg" alt="" width="24" height="24">제주 모험</button>
    <button data-page="history"><img src="./assets/stats.svg" alt="" width="24" height="24">기록</button>
  </nav>
</div>
<dialog id="dialog" aria-labelledby="dialog-title"><form method="dialog" class="close"><button aria-label="닫기">×</button></form><h2 id="dialog-title"></h2><div id="dialog-body"></div></dialog>
</body>
</html>
